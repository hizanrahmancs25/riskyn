workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

stages:
  - build
  - test

frontend:
  stage: build
  image: node:22-bookworm
  script:
    - cd frontend
    - npm install --no-audit --no-fund
    - npm test
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 week

backend:
  stage: test
  image: python:3.12-slim
  needs:
    - job: frontend
      artifacts: true
  script:
    - pip install --no-cache-dir -r backend/requirements-dev.txt
    - cp -r frontend/dist backend/static
    - python -m pytest backend/tests -q

browser:
  stage: test
  image: node:22-bookworm
  needs:
    - job: frontend
      artifacts: true
  script:
    - apt-get update && apt-get install -y --no-install-recommends python3-venv
    - python3 -m venv /tmp/riskyn-venv
    - export PATH="/tmp/riskyn-venv/bin:$PATH"
    - pip install --no-cache-dir -r backend/requirements.txt
    - cp -r frontend/dist backend/static
    - cd frontend
    - npm install --no-audit --no-fund
    - npx playwright install --with-deps chromium
    - npm run test:e2e
  artifacts:
    when: always
    paths:
      - frontend/playwright-report/
      - frontend/test-results/
    expire_in: 1 week
